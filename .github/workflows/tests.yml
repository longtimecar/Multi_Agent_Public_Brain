name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # The capture adapters and process detection target Windows; run the suite
    # on the platform the project actually supports.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run tests
        # The suite is fully offline: LLM/embedding calls are faked and each test
        # builds its own settings, so no .env or API keys are required here.
        run: uv run pytest tests -q

      - name: Check dashboard JavaScript syntax
        run: node --check src/membrain/web/app.js