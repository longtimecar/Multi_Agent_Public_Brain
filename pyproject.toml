[project]
name = "membrain"
version = "0.1.0"
description = "Portable, user-owned, cross-agent long-term memory"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "zstandard>=0.25.0",
    "pypdf>=5.0",
    # Windows ships no IANA timezone database; without tzdata, ZoneInfo("Asia/…")
    # raises and MEMBRAIN_TZ silently falls back to the system timezone.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# DeepSeek Harness writes its session transcripts zstd-compressed. Python 3.14
# ships zstd in the standard library; older interpreters need this package.
dsh = ["zstandard>=0.22"]

[project.scripts]
membrain = "membrain.cli:main"
membrain-mcp = "membrain.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/membrain"]

# A checkout also holds the live memory tree, browser profiles and media
# assets. None of it belongs in a distribution — without this list the sdist
# would ship hundreds of megabytes of the owner's personal data.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/scripts",
    "/harness",
    "/skills",
    "/docs/DESIGN.md",
    "/docs/PLAN.md",
    "/docs/TESTING.md",
    "/docs/ONBOARDING.md",
    "/docs/OPEN_SOURCE_MEMORY_RESEARCH.md",
    "/README.md",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/LICENSE",
    "/RELEASE-NOTES.md",
    "/.env.example",
    "/.mcp.json.example",
    "/.gitignore",
    "/pyproject.toml",
]
exclude = [
    "/memory",
    "/dist",
    "/.edge-check",
    "/.venv",
    "/.state",
    "/.workbuddy",
    "/.pytest_cache",
    "/promo_membrain_20261031",
    "/reference_materials",
    "/content_directions",
    "/docs/backups",
    "/docs/evidence",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
